# Sanctioned automation leases — D-090 Recognition (ludex/core/integrity.is_sanctioned).
#
# The integrity sweep (tools/integrity_sweep.py) recognizes a scheduler whose identifier
# matches a lease's `match` substrings as SELF — a sanctioned writer — and does NOT flag it
# as drift. Any ludex-automation NOT matched here is flagged for review. Adding a lease is a
# DELIBERATE caretaker act (sanctioning a writer is JJ's call), never a default.
#
# WAKE-OWNERSHIP = ORIGIN. Each habitat's heartbeat pulses/wakes ONLY its own-origin
# creatures — enforced structurally by the origin-guard (a foreign-origin persistent build is
# refused; see ephemeral_creature + the build-time host check). A heartbeat cannot wake another
# habitat's creatures, and a creature is woken only on the machine it is homed to (its
# `origin`), regardless of where its brain runs. This is why the 6 Ray-origin HIATUS creatures
# are Ray's to wake even though four carry cloud-CLI brains.

leases:
  - name: mac-habitat-heartbeat
    match: ["com.ludex.macHabitat.heartbeat"]
    kind: heartbeat
    host: Mac-habitat
    note: >-
      D-051 life-support metabolism (Mac-origin creatures only). Guarded by the ① freshness
      gate + metabolism-only (cf0ac30). The redundant `crontab` heartbeat entry was REMOVED
      2026-06-30 (backup in that session's scratchpad) — launchd `com.ludex.macHabitat.heartbeat`
      is now the SOLE Mac scheduler; the double-fire risk is resolved.

  - name: ray-habitat-heartbeat
    match: ["LudexRayHabitatHeartbeat"]
    kind: heartbeat
    host: Ray-habitat
    note: >-
      D-051 life-support (Ray-origin creatures only). RE-ENABLED 2026-06-20 after the deliberate
      post-hiatus wake (commit 1c61052): 5/6 markers consumed (Anvil/Flint/Hearth/Loom/Quill).
      Wick's marker remains (gemini brain deprecated → reflect_empty) — a harmless metabolism-only
      post_hiatus no-op each pulse until its brain migrates to agy. Guarded by the ① freshness
      gate + metabolism-only (cf0ac30).
