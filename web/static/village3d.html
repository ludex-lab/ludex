<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludex Village 3D</title>
<style>
  html, body { margin:0; height:100%; background:#0d1117; overflow:hidden;
               font:13px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; }
  #hud { position:fixed; left:12px; top:10px; z-index:10; color:#c9d1d9;
         background:rgba(13,17,23,.72); border:1px solid #30363d; border-radius:10px;
         padding:8px 12px; user-select:none; }
  #hud b { color:#7ee0a3; font-weight:600; }
  #hud label { margin-right:10px; cursor:pointer; }
  #status { color:#8b949e; margin-top:2px; }
  #cap { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:10;
         color:#e6edf3; background:rgba(22,27,34,.85); border:1px solid #30363d;
         border-radius:999px; padding:6px 16px; opacity:0; transition:opacity .4s; }
  #minimap { position:fixed; right:14px; bottom:14px; z-index:10; width:192px; height:192px;
             border:1px solid #30363d; border-radius:10px; background:#0d1117cc;
             cursor:crosshair; }
</style>
</head>
<body>
<canvas id="minimap" width="192" height="192"></canvas>
<div id="hud">
  <span id="hud-title"><b>Ludex Village 3D</b> — <span data-v="subtitle"></span></span>
  <div>
    <label><input type="checkbox" id="follow" checked> <span data-v="follow"></span></label>
    <label><span data-v="speed"></span> <input type="range" id="speed" min="0.5" max="3" step="0.25" value="1" style="vertical-align:middle;width:90px"></label>
    <span id="status"></span>
    <button id="replayAll" data-v="replay_all" style="margin-left:8px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px"></button>
    <button id="skipBtn" data-v="skip" style="display:none;margin-left:8px;background:#2b2113;color:#e0c97e;border:1px solid #5a4a24;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px"></button>
  </div>
</div>

<script type="module">
import * as THREE from "/static/vendor/three.module.js";

/* ---------- data (the same real-data APIs as the 2.5D view) ---------- */
const [MAP, STATE, SCN, OUTFITS] = await Promise.all([
  fetch("/api/village/map").then(r => r.json()),
  fetch("/api/village/state").then(r => r.json()),
  fetch("/api/village/scenes?limit=400").then(r => r.json()),
  fetch("/api/village/outfits").then(r => r.json()).catch(() => ({})),
]);
let SCENES = SCN.scenes || [];
const G = MAP.grid;
const WALKTEST = new URLSearchParams(location.search).get("walktest") === "1";

/* i18n — shares the app's ludex_lang preference */
let VLANG = (() => { try { return localStorage.getItem("ludex_lang") === "ko" ? "ko" : "en"; }
                     catch { return "en"; } })();
const VSTR = {
  en: { subtitle: "view principle: real scenes only", follow: "Follow the action", speed: "Speed",
        skip: "Skip speech \u25B8",
        loading: "loading…", live: "live", waiting: "waiting for live scenes", mayor: "Mayor",
        cap_reflect: "checking {n}'s reflection", cap_hb: "checking {n}'s pulse",
        cap_field: "{w} — a stage of {k}", cap_report: "writing the village report",
        cap_duty: "{n} — the day's work at the {o} desk",
        cap_letter: "a letter — {a} → {b}",
        cap_meeting: "a working meeting of {k} — {w}",
        cap_agora: "the agora in session — {k} present, {w}",
        cap_ruling: "a ruling posted — {w}",
        cap_notice: "pinned on the board — {w}",
        cap_arrival: "welcoming {n} — newly arrived", replay_all: "replay from start",
        cap_transition: "{n}'s substrate moved — {f} → {t}",
        cap_turnover: "a generation turns over — {k} residents, {a} axis, nobody gone" },
  ko: { subtitle: "뷰-원칙: 실재 장면만", follow: "장면 따라가기", speed: "속도",
        skip: "대사 건너뛰기 \u25B8",
        loading: "로딩…", live: "가동", waiting: "실시간 대기 중", mayor: "촌장",
        cap_reflect: "{n}의 반성을 살핀다", cap_hb: "{n}의 맥박을 살핀다",
        cap_field: "{w} — {k}마리의 무대", cap_report: "촌정 보고를 쓴다",
        cap_duty: "{n} — {o} 데스크의 오늘 일",
        cap_letter: "편지 — {a} → {b}",
        cap_meeting: "{k}인의 실무 회의 — {w}",
        cap_agora: "아고라가 열리다 — {k}인 참석, {w}",
        cap_ruling: "판결문이 붙다 — {w}",
        cap_notice: "게시판에 붙다 — {w}",
        cap_arrival: "새로 온 {n}를 맞이한다", replay_all: "처음부터 다시보기",
        cap_transition: "{n}의 기질이 옮겨졌다 — {f} → {t}",
        cap_turnover: "세대가 넘어간다 — {k}명, {a}축, 아무도 떠나지 않았다" },
};
const vt = k => (VSTR[VLANG][k] ?? VSTR.en[k] ?? k);
let mayorRef = null;   // set after the mayor exists (const in TDZ until then)
function applyVLang() {
  document.querySelectorAll("[data-v]").forEach(el => { el.textContent = vt(el.dataset.v); });
  if (mayorRef && mayorRef.userData.nameLabel) {
    const old = mayorRef.userData.nameLabel;
    mayorRef.remove(old); old.material.map.dispose();
    const nl = label(vt("mayor"), "#7ee0a3", 12);
    nl.position.y = 1.6; mayorRef.add(nl); mayorRef.userData.nameLabel = nl;
  }
}
applyVLang();
document.getElementById("status").textContent = vt("loading");
// live language sync: the app's toggle writes ludex_lang; same-origin
// sibling contexts (this iframe / other tabs) get the storage event
addEventListener("storage", e => {
  if (e.key === "ludex_lang") { VLANG = e.newValue === "ko" ? "ko" : "en"; applyVLang(); }
});
const EMBED = new URLSearchParams(location.search).get("embed") === "1";
if (EMBED) document.getElementById("hud-title").style.display = "none";  // the app tab carries the title

/* ---------- routing: straight port of the 2.5D collision contract ---------- */
const TILE_COST = { p: 1, P: 1, g: 2.5, f: 2.5, b: 2.5, s: 3.5 };
const BLOCKED = new Set();
const OCCUPIED = new Set();    // tiles residents stand on — walk around, not through
const OPEN_FAC = new Set(["agora", "forum_square", "wilderness_grove"]);  // enterable spaces
for (const [k, v] of Object.entries(MAP.plots || {})) {
  let rad = 0;
  if (k.startsWith("facility:")) {
    const id = k.slice(9);
    if (OPEN_FAC.has(id)) continue;          // open ground — walk in
    rad = id === "notice_board" ? 0 : 1;
  }
  for (let dc = -rad; dc <= rad; dc++)
    for (let dr = -rad; dr <= rad; dr++)
      BLOCKED.add((v.row + dr) * G + (v.col + dc));
}
for (const pr of (MAP.props || [])) BLOCKED.add(pr.row * G + pr.col);  // trees/rocks are solid
function walkableCost(c, r) {
  if (r < 0 || c < 0 || r >= G || c >= G) return null;
  const base = TILE_COST[MAP.tiles[r][c]];
  if (base === undefined) return null;
  if (BLOCKED.has(r * G + c)) return null;
  if (OCCUPIED.has(r * G + c)) return null;   // residents are solid too
  return base;
}
function doorstep(plot, exclude) {
  const cand = [];
  for (let dc = -2; dc <= 2; dc++) for (let dr = -2; dr <= 2; dr++) {
    const c = plot.col + dc, r = plot.row + dr;
    if (walkableCost(c, r) === null) continue;
    if (exclude && exclude.has(r * G + c)) continue;   // a resident stands there
    cand.push({ col: c, row: r, d: Math.max(Math.abs(dc), Math.abs(dr)), front: dc + dr });
  }
  if (!cand.length) return plot;
  cand.sort((a, b) => a.d - b.d || b.front - a.front);
  return cand[0];
}
function findRoute(from, to) {
  const key = (c, r) => r * G + c;
  const start = { c: Math.round(from.col), r: Math.round(from.row) };
  const goal = { c: Math.round(to.col), r: Math.round(to.row) };
  const dist = new Map([[key(start.c, start.r), 0]]);
  const prev = new Map();
  const pq = [[0, start.c, start.r]];
  while (pq.length) {
    let bi = 0;
    for (let i = 1; i < pq.length; i++) if (pq[i][0] < pq[bi][0]) bi = i;
    const [d, c, r] = pq.splice(bi, 1)[0];
    if (c === goal.c && r === goal.r) break;
    if (d > (dist.get(key(c, r)) ?? Infinity)) continue;
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      const cost = walkableCost(nc, nr);
      if (cost === null) continue;
      const nd = d + cost + 2.2 * Math.abs(tileH(nc, nr) - tileH(c, r));  // roads follow valleys
      if (nd < (dist.get(key(nc, nr)) ?? Infinity)) {
        dist.set(key(nc, nr), nd);
        prev.set(key(nc, nr), [c, r]);
        pq.push([nd, nc, nr]);
      }
    }
  }
  const route = [];
  let cur = [goal.c, goal.r];
  if (!prev.has(key(goal.c, goal.r)) && !(start.c === goal.c && start.r === goal.r)) {
    // unreachable goal (walled plot) → nearest walkable stop
    return [];
  }
  while (cur && !(cur[0] === start.c && cur[1] === start.r)) {
    route.unshift({ col: cur[0], row: cur[1] });
    cur = prev.get(key(cur[0], cur[1]));
  }
  return route;
}

/* ---------- three scene ---------- */
const W = () => window.innerWidth, H = () => window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W(), H());
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101726);
scene.fog = new THREE.Fog(0x101726, 70, 210);

const camera = new THREE.PerspectiveCamera(46, W() / H(), 0.1, 520);
scene.add(new THREE.HemisphereLight(0xbdd4ff, 0x2a2118, 0.85));
const sun = new THREE.DirectionalLight(0xfff2dc, 1.6);
sun.position.set(18, 26, 10);
sun.castShadow = true;
scene.add(sun.target);         // the shadow window tracks the mayor (big island)
sun.shadow.mapSize.set(2048, 2048);
const sc = 22;
sun.shadow.camera.left = -sc; sun.shadow.camera.right = sc;
sun.shadow.camera.top = sc; sun.shadow.camera.bottom = -sc;
scene.add(sun);

/* ---- relief: deterministic rolling hills from MAP.seed (same-village-
   same-hills, the land-registry principle applied to height). Plot
   footprints flatten to plateaus; water stays at sea level. Amplitude is
   restrained — cliffs/bridges remain terrain-v2. ---- */
function seededNoise(seed) {
  const hash = (x, y) => {
    let h = (x * 374761393 + y * 668265263 + seed * 1442695040888963407) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (((h ^ (h >>> 16)) >>> 0) / 4294967295);
  };
  const smooth = v => v * v * (3 - 2 * v);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const fx = smooth(x - xi), fy = smooth(y - yi);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
}
const HMAP = [];
{
  const seedNum = (String(MAP.seed || "0").split("").reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) | 0, 7)) >>> 0;
  const n1 = seededNoise(seedNum), n2 = seededNoise(seedNum ^ 0x9e3779b9);
  // landform HILLS — a few deliberate gaussian rises in the countryside
  // (seeded, plot-avoiding). Noise alone reads as ripple in block grammar;
  // hills you must walk around are what makes relief legible.
  const rng = (i) => { let x = (seedNum ^ (i * 0x9e3779b9)) >>> 0;
    x = Math.imul(x ^ (x >>> 15), 2246822519); x = Math.imul(x ^ (x >>> 13), 3266489917);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967295; };
  const hills = [];
  const plotList = Object.values(MAP.plots || {});
  for (let i = 0; hills.length < 6 && i < 60; i++) {
    const hc = 8 + rng(i * 3 + 1) * (G - 16), hr = 8 + rng(i * 3 + 2) * (G - 16);
    const dC = Math.hypot(hc - G / 2, hr - G / 2);
    if (dC < 15 || dC > 40) continue;                       // countryside ring only
    if (plotList.some(v => Math.hypot(hc - v.col, hr - v.row) < 10)) continue;
    hills.push({ c: hc, r: hr, amp: 2.2 + rng(i * 3 + 3) * 2.3, rad: 5 + rng(i * 7) * 5 });
  }
  for (let r = 0; r < G; r++) {
    HMAP.push([]);
    for (let c = 0; c < G; c++) {
      const code = MAP.tiles[r][c];
      if (code === "w" || code === "W") { HMAP[r].push(-0.12); continue; }
      let h = 1.1 * n1(c * 0.17, r * 0.17) + 0.35 * n2(c * 0.37, r * 0.37);
      for (const hl of hills) {
        const d = Math.hypot(c - hl.c, r - hl.r);
        h += hl.amp * Math.exp(-(d * d) / (2 * hl.rad * hl.rad));
      }
      if (code === "s") h = Math.min(h, 0.10);          // beaches hug the sea
      h = Math.round(h * 2) / 2;                        // terraces: block-grammar contours
      HMAP[r].push(Math.max(0.02, h));
    }
  }
  // plateaus under plots (and a 1-tile apron) so buildings sit level
  for (const [k, v] of Object.entries(MAP.plots || {})) {
    const rad = (k.startsWith("facility:") ? 1 : 0) + 1;
    const base = HMAP[v.row]?.[v.col] ?? 0.3;
    for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
      const rr = v.row + dr, cc = v.col + dc;
      if (rr < 0 || cc < 0 || rr >= G || cc >= G) continue;
      const code = MAP.tiles[rr][cc];
      if (code === "w" || code === "W") continue;
      HMAP[rr][cc] = base;
    }
  }
}
function tileH(c, r) {
  if (r < 0 || c < 0 || r >= G || c >= G) return -0.12;
  return HMAP[r][c];
}
function groundY(x, z) {          // bilinear over tile centers for smooth walking
  const c = x + G / 2 - 0.5, r = z + G / 2 - 0.5;
  const c0 = Math.floor(c), r0 = Math.floor(r), fc = c - c0, fr = r - r0;
  const a = tileH(c0, r0), b = tileH(c0 + 1, r0), d = tileH(c0, r0 + 1), e = tileH(c0 + 1, r0 + 1);
  return a + (b - a) * fc + (d - a) * fr + (a - b - d + e) * fc * fr;
}
const world = (c, r) => new THREE.Vector3(c - G / 2 + 0.5, 0, r - G / 2 + 0.5);

/* ---- texture pack #1 (contract v2): geometry is code's, surfaces are the
   pack's. Every material falls back to flat color when a slot is absent —
   the village must render with no pack at all. ---- */
const TEX = {};
{
  const packs = {
    "pack1/": ["ground_grass","ground_grass_flower","ground_grass_dark","ground_path",
      "ground_plaza","ground_sand","ground_water","ground_water_deep","house_wall",
      "house_roof","house_door","facility_wall","facility_roof","tile_side","wood","stone"],
    "pack2/": ["face_mayor","face_claude","face_gpt","face_gemini","face_grok","face_qwen",
      "face_gemma","face_exaone","face_unknown","face_dormant","body_mayor","body_tunic",
      "body_robe","body_apron","body_cloak","body_vest","body_scarf"],
  };
  const loader = new THREE.TextureLoader();
  const jobs = [];
  for (const [dir, slots] of Object.entries(packs))
    for (const s of slots)
      jobs.push(new Promise((res, rej) => {
        loader.load(`/static/village3d/textures/${dir}${s}.png`, tx => {
          tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
          tx.colorSpace = THREE.SRGBColorSpace;
          TEX[s] = tx; res();
        }, undefined, rej);
      }));
  await Promise.allSettled(jobs);
}
const tmat = (slot, color = 0xffffff, opts = {}) =>
  new THREE.MeshLambertMaterial({ color, ...(TEX[slot] ? { map: TEX[slot] } : {}), ...opts });
const GROUND_SLOT = { g: "ground_grass", f: "ground_grass_flower", b: "ground_grass_dark",
  p: "ground_path", P: "ground_plaza", s: "ground_sand", w: "ground_water", W: "ground_water_deep" };

/* ground — one instanced box per tile, per-instance color (asset seam:
   Grok terrain glTF replaces this mesh wholesale later) */
const TILE_COLOR = {
  g: 0x7fb069, f: 0x96be78, b: 0x75a662, p: 0xc4b096, P: 0xd0c4b2,
  s: 0xd8c8a0, w: 0x4a7fa8, W: 0x2f5f86,
};
{
  const BED = -1.1;
  const byCode = {};
  for (let r = 0; r < G; r++) for (let c = 0; c < G; c++)
    (byCode[MAP.tiles[r][c]] ??= []).push([c, r]);
  const tileGeo = new THREE.BoxGeometry(1, 1, 1);
  for (const [code, cells] of Object.entries(byCode)) {
    const water = code === "w" || code === "W";
    const topMat = tmat(GROUND_SLOT[code], TEX[GROUND_SLOT[code]] ? 0xffffff : (TILE_COLOR[code] ?? 0x666666));
    const sideMat = water ? topMat
      : tmat("tile_side", TEX.tile_side ? 0xffffff : 0x8a6a48);
    // BoxGeometry groups: +x,-x,+y(top),-y,+z,-z
    const mats = [sideMat, sideMat, topMat, sideMat, sideMat, sideMat];
    const inst = new THREE.InstancedMesh(tileGeo, mats, cells.length);
    inst.receiveShadow = true;
    const m = new THREE.Matrix4(); const col = new THREE.Color();
    cells.forEach(([c, r], i) => {
      const top = tileH(c, r);
      const p = world(c, r);
      const colH = top - BED;
      m.makeScale(1, colH, 1);
      m.setPosition(p.x, BED + colH / 2, p.z);
      inst.setMatrixAt(i, m);
      // contour tint still multiplies over the texture (subtler now)
      col.setHex(0xffffff);
      if (!water) col.multiplyScalar(0.8 + 0.34 * Math.min(1, top / 4.5));
      if (!TEX[GROUND_SLOT[code]]) col.multiply(new THREE.Color(TILE_COLOR[code] ?? 0x666666));
      inst.setColorAt(i, col);
    });
    scene.add(inst);
  }
}

/* text label as sprite */
function label(text, color = "#e6edf3", size = 15, dot = null) {
  const cv = document.createElement("canvas");
  const ctx = cv.getContext("2d");
  ctx.font = `600 ${size * 4}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
  const dotW = dot ? size * 2.4 : 0;   // room for the pulse dot before the text
  cv.width = Math.max(2, ctx.measureText(text).width + 24 + dotW); cv.height = size * 4 + 18;
  const c2 = cv.getContext("2d");
  c2.font = `600 ${size * 4}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
  c2.fillStyle = "rgba(13,17,23,.62)";
  c2.beginPath(); c2.roundRect(0, 0, cv.width, cv.height, 16); c2.fill();
  if (dot) {
    c2.fillStyle = dot;
    c2.beginPath(); c2.arc(12 + size * 0.9, cv.height / 2, size * 0.85, 0, Math.PI * 2); c2.fill();
  }
  c2.fillStyle = color; c2.textBaseline = "middle";
  c2.fillText(text, 12 + dotW, cv.height / 2 + 2);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.scale.set(cv.width / 260, cv.height / 260, 1);
  return sp;
}

/* houses & facilities — procedural placeholders (asset seam: swap for the
   Grok glTF pack per archetype; keep the group/name contract) */
function makeHouse(accent) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.75, 0.85),
    tmat("house_wall", TEX.house_wall ? 0xd9cdb8 : 0xcbb79b));
  body.position.y = 0.38; body.castShadow = true; body.receiveShadow = true;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.6, 4),
    tmat("house_roof", accent));         // achromatic roof texture × archetype tint
  roof.position.y = 1.05; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
  const door = TEX.house_door
    ? new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.42),
        tmat("house_door", 0xffffff, { transparent: true }))
    : new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.32, 0.04),
        new THREE.MeshLambertMaterial({ color: 0x5d4636 }));
  door.position.set(0, TEX.house_door ? 0.22 : 0.17, TEX.house_door ? 0.452 : 0.45);
  g.add(body, roof, door);
  return g;
}
const mat = c => new THREE.MeshLambertMaterial({ color: c });
const woodMat = () => tmat("wood", TEX.wood ? 0xb08a5f : 0x6b4a2f);
const stoneMat = () => tmat("stone", TEX.stone ? 0xbfbfc4 : 0x8a8f96);
const facWall = () => tmat("facility_wall", TEX.facility_wall ? 0xded8ca : 0xa9a08e);
const facRoof = (c) => tmat("facility_roof", c);
function makeTree(s = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09 * s, 0.12 * s, 0.5 * s, 6), woodMat());
  trunk.position.y = 0.25 * s; trunk.castShadow = true;
  const c1 = new THREE.Mesh(new THREE.ConeGeometry(0.42 * s, 0.7 * s, 7), mat(0x3f7a4a));
  c1.position.y = 0.75 * s; c1.castShadow = true;
  const c2 = new THREE.Mesh(new THREE.ConeGeometry(0.3 * s, 0.55 * s, 7), mat(0x4a8f57));
  c2.position.y = 1.12 * s; c2.castShadow = true;
  g.add(trunk, c1, c2);
  return g;
}
function makeRock() {
  const m2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.26, 0), stoneMat());
  m2.scale.y = 0.62; m2.position.y = 0.1; m2.castShadow = true;
  const g = new THREE.Group(); g.add(m2); return g;
}

  const gy = u.gy || 0;
  if (moving) {
    const s = Math.sin(u.t);
    u.legL.rotation.x = 0.62 * s; u.legR.rotation.x = -0.62 * s;
    u.armL.rotation.x = -0.42 * s; u.armR.rotation.x = 0.42 * s;
    p.rotation.z = 0.045 * Math.sin(u.t);                 // weight roll
    p.position.y = gy + 0.035 * Math.abs(Math.cos(u.t));  // gait bob over ground
  } else {
    u.legL.rotation.x *= 0.85; u.legR.rotation.x *= 0.85;
    u.armL.rotation.x *= 0.85; u.armR.rotation.x *= 0.85;
    p.rotation.z *= 0.85;
    p.position.y = gy + 0.012 * Math.sin(u.t);            // breathing (presence, not behavior)
  }
  if (u.ring && u.emo) {
    // emotion ring breath: calm sets how present it is, arousal how fast it beats
    const base = 0.14 + 0.5 * (u.emo.calm ?? 0);
    const pace = 0.6 + 6 * (u.emo.arousal ?? 0);

  const from = p.position.clone(); from.y += 0.9;
  for (const bn of (p.userData.bonds || [])) {
    const other = residents.find(r => r.userData.name.toLowerCase() === bn.toLowerCase());
    if (!other) continue;
    const to = other.position.clone(); to.y += 0.9;
    const mid = from.clone().add(to).multiplyScalar(0.5);
    mid.y += Math.max(1.2, from.distanceTo(to) * 0.18);
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(from, mid, to), 24, 0.04, 6),
      new THREE.MeshBasicMaterial({ color: 0xe0c97e, transparent: true, opacity: 0.38, depthWrite: false }));
    bondGroup.add(tube);
  }
}
const ray = new THREE.Raycaster();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt) return;
  const moved = Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y);
  downAt = null;
  if (moved > 6) return;                       // camera drag, not a click
  ray.setFromCamera(new THREE.Vector2((e.clientX / W()) * 2 - 1, -(e.clientY / H()) * 2 + 1), camera);
  const hit = ray.intersectObjects(residents, true)[0];
  if (!hit) { clearBonds(); return; }
  let g = hit.object;
  while (g && !g.userData.name) g = g.parent;
  if (!g || g.userData.name === bondSel) { clearBonds(); return; }
  showBonds(g);
});

/* one animation step for every walking body — the mayor and the turn's
   actors alike. Extracted from tick() so tests (and hidden tabs, where
   rAF is suspended) can drive the same logic without a frame. */
function advanceWalkers(dt, speed) {
  if (M.moving && M.wp) {
    const a = world(M.pos.col, M.pos.row), b = world(M.wp.col, M.wp.row);
    M.prog += dt * speed;
    if (M.prog >= 1) {
      M.pos = { col: M.wp.col, row: M.wp.row };
      M.ri++;
      if (M.ri >= M.route.length) {
        mayor.position.set(b.x, mayor.position.y, b.z);
        mayor.userData.gy = tileH(M.wp.col, M.wp.row);
        arrive();
      }
      else { M.wp = M.route[M.ri]; M.prog = 0; }
    } else {
      const x = a.x + (b.x - a.x) * M.prog, z = a.z + (b.z - a.z) * M.prog;
      mayor.rotation.y = Math.atan2(b.x - x, b.z - z);
      mayor.position.x = x; mayor.position.z = z;
      mayor.userData.gy = groundY(x, z);
    }
  }
  if (ACTIVE.length) {
    let still = 0;
    for (const w of ACTIVE) {
      if (!w.moving) continue;
      const a2 = world(w.pos.col, w.pos.row), b2 = world(w.wp.col, w.wp.row);
      w.prog += dt * speed;
      if (w.prog >= 1) {
        w.pos = { col: w.wp.col, row: w.wp.row };
        w.ri++;
        if (w.ri >= w.route.length) {
          w.mesh.position.set(b2.x, w.mesh.position.y, b2.z);
          w.mesh.userData.gy = tileH(w.wp.col, w.wp.row);
          w.moving = false;
        } else { w.wp = w.route[w.ri]; w.prog = 0; }
      } else {
        const x = a2.x + (b2.x - a2.x) * w.prog, z = a2.z + (b2.z - a2.z) * w.prog;
        w.mesh.rotation.y = Math.atan2(b2.x - x, b2.z - z);
        w.mesh.position.x = x; w.mesh.position.z = z;
        w.mesh.userData.gy = groundY(x, z);
      }
      if (w.moving) still++;
    }
    if (!still) { WALK_DONE = ACTIVE; ACTIVE = []; arrive(); }
  }
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.08);
  const speed = parseFloat(document.getElementById("speed").value) * 2.4; // tiles/sec

  advanceWalkers(dt, speed);

  const walking = new Set(ACTIVE.filter(w => w.moving).map(w => w.mesh));
  animatePerson(mayor, dt, M.moving);
  for (const r of residents) animatePerson(r, dt, walking.has(r));

  if (bubble) {
    const left = bubble.userData.until - performance.now();
    if (left < 0) {
      if (bubblePages.length) renderBubblePage(bubblePages.shift(), bubblePages.length > 0);
      else {
        (bubbleHolder || mayor).remove(bubble); bubble.material.map.dispose(); bubble = null;
        document.getElementById("skipBtn").style.display = "none";
      }
    }
    else bubble.material.opacity = Math.min(1, left / 500);
  }
  for (const r of residents) {
    if (r.userData.greetUntil && performance.now() > r.userData.greetUntil) {
      r.rotation.y = Math.PI; r.userData.greetUntil = null;   // back to facing the road
    }
  }
  const heroPos = (PRIMARY || mayor).position;
  sun.position.set(heroPos.x + 18, 26, heroPos.z + 10);
  sun.target.position.copy(heroPos);
  if (document.getElementById("follow").checked) cam.target.lerp(heroPos, Math.min(1, dt * 3.2));
  applyCam();
  drawMinimap();
  renderer.render(scene, camera);
}
tick();
document.getElementById("status").textContent = vt("live");
window.__find = (pred) => SCENES.findIndex(pred);
window.__scenesOn = (dayStr) => SCENES
  .map((s, i) => ({ i, kind: s.kind, t: s.t, actors: s.actors,
                    when: new Date(s.t * 1000).toLocaleString("ko-KR") }))
  .filter(r => r.when.includes(dayStr));
window.__poseScene = async (idx, opts = {}) => {
  CHAIN++;                       // stop the running chain from stealing the stage
  M.queue = [SCENES[idx]]; M.qi = 0; M.moving = false; ACTIVE = [];
  nextScene();
  for (let k = 0; k < 900 && (M.moving || ACTIVE.some(w => w.moving)); k++)
    advanceWalkers(0.5, 6);
  if (opts.dist) cam.dist = opts.dist;
  if (opts.az !== undefined) cam.az = opts.az;
  if (opts.el !== undefined) cam.el = opts.el;
  cam.target.copy((PRIMARY || mayor).position);
  applyCam();
  renderer.render(scene, camera);
  return caption(SCENES[idx]);
};
window.__shoot = async (name) => {
  renderer.render(scene, camera);
  const data = renderer.domElement.toDataURL("image/jpeg", 0.92);
  const r = await fetch("/api/village/snapshot", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ data, name }) }).then(x => x.json());
  return r;
};

window.__step = (dt = 0.2) => advanceWalkers(dt, 6);
window.__tiles = () => {
  const rows = residents.map(r => ({ n: r.userData.name, ...(r.userData.tile || {}) }));
  rows.push({ n: "촌장", col: M.pos.col, row: M.pos.row });
  const seen = new Map(), dups = [];
  for (const r of rows) {
    const k = r.row * G + r.col;
    if (seen.has(k)) dups.push([seen.get(k), r.n]);
    seen.set(k, r.n);
  }
  return { bodies: rows.length, dups };
};
window.__wraptest = t => bubbleWrap(t).length;
window.__next = () => nextScene();
/* annals photography — pose the village on a chosen scene and shoot it.
   The camera only ever frames something the ledger records: pick the
   scene by index, run its walk to completion, then capture. */
window.__dbg = () => ({ qi: M.qi, len: M.queue.length, mMoving: M.moving,
  ri: M.ri, routeLen: (M.route || []).length, prog: M.prog, wp: M.wp,
  pos: M.pos, mayorXZ: [mayor.position.x.toFixed(1), mayor.position.z.toFixed(1)],
  speedVal: document.getElementById("speed").value,
  scene: M.sceneNow && { kind: M.sceneNow.kind, actors: M.sceneNow.actors, where: M.sceneNow.where },
  active: ACTIVE.map(w => ({ n: w.mesh.userData.name, moving: w.moving, ri: w.ri, len: w.route.length })) });
</script>
